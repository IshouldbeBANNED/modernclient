<!DOCTYPE html>
<html style="width:100%;height:100%;background-color:black;">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Eaglercraft 1.12 WASM-GC</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #game_frame {
            width: 100%;
            height: 100%;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            z-index: 1000;
        }
        .spinner {
            border: 4px solid #333;
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body id="game_frame">
    <div id="loading">
        <div class="spinner"></div>
        <p>Loading Eaglercraft...</p>
        <p style="font-size: 12px; color: #999;">This loads from GitHub</p>
    </div>
</body>
<script type="text/javascript">
    "use strict";
    window.addEventListener("load", async function() {
        const loading = document.getElementById('loading');
        
        try {
            if(window.location.href.indexOf("file:") === 0) {
                loading.innerHTML = '<p style="color: #ff6666;">⚠️ Error: Cannot run from file://</p><p>Open in a web browser via HTTP server</p>';
                return;
            }
            
            if(typeof WebAssembly.Suspending === "undefined") {
                loading.innerHTML = '<p style="color: #ff6666;">⚠️ JSPI Not Enabled</p><p>In Chrome: Press Ctrl+Shift+I → Search "JSPI" → Enable</p>';
                return;
            }
            
            loading.innerHTML = '<div class="spinner"></div><p>Downloading game files...</p>';
            
            const relayId = Math.floor(Math.random() * 3);
            const eaglercraftXOpts = {
                demoMode: false,
                localesURI: "https://raw.githubusercontent.com/IshouldbeBANNED/modernclient/main/wasm/lang/",
                worldsDB: "worlds",
                servers: [
                    { addr: "ws://localhost:8081/", name: "Local test server" }
                ],
                relays: [
                    { addr: "wss://relay.deev.is/", comment: "lax1dude relay #1", primary: relayId === 0 },
                    { addr: "wss://relay.lax1dude.net/", comment: "lax1dude relay #2", primary: relayId === 1 },
                    { addr: "wss://relay.shhnowisnottheti.me/", comment: "ayunami relay #1", primary: relayId === 2 }
                ]
            };
            
            const assetsEPK = new Uint8Array(
                await fetch("https://raw.githubusercontent.com/IshouldbeBANNED/modernclient/main/wasm/assets.epk")
                    .then(resp => resp.arrayBuffer())
            );
            
            window.__eaglercraftXLoaderContext = {
                getEaglercraftXOpts: () => eaglercraftXOpts,
                getEagRuntimeJSURL: () => "https://raw.githubusercontent.com/IshouldbeBANNED/modernclient/main/wasm/eagruntime.js",
                getClassesWASMURL: () => "https://raw.githubusercontent.com/IshouldbeBANNED/modernclient/main/wasm/classes.wasm",
                getClassesDeobfWASMURL: () => "https://raw.githubusercontent.com/IshouldbeBANNED/modernclient/main/wasm/classes.wasm-deobfuscator.wasm",
                getClassesTEADBGURL: () => "https://raw.githubusercontent.com/IshouldbeBANNED/modernclient/main/wasm/classes.wasm.teadbg",
                getEPKFiles: () => [{ name: "assets.epk", path: "", data: assetsEPK }],
                getRootElement: () => document.body,
                getMainArgs: () => [],
                getImageURL: (idx) => {
                    const base = "https://raw.githubusercontent.com/IshouldbeBANNED/modernclient/main/wasm/";
                    const imgs = ["splash.png", "pressAnyKey.png", "crashLogo.png", "favicon.png"];
                    return imgs[idx] ? base + imgs[idx] : null;
                },
                runMain: (fn) => setTimeout(fn, 10)
            };
            
            loading.remove();
            
            const script = document.createElement("script");
            script.src = "https://raw.githubusercontent.com/IshouldbeBANNED/modernclient/main/wasm/eagruntime.js";
            script.onerror = () => {
                document.body.innerHTML = '<p style="color: #ff6666; margin-top: 100px;">Failed to load game. Check your internet connection.</p>';
            };
            document.head.appendChild(script);
            
        } catch(ex) {
            loading.innerHTML = `<p style="color: #ff6666;">Error: ${ex.message}</p>`;
        }
    });
</script>
</html>
